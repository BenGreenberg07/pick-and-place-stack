[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-and-place-stack"
version = "0.1.0"
description = "A 2D visual pick-and-place stack: camera pixels to joint angles, measured against ground truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Greenberg" }]
keywords = ["robotics", "inverse-kinematics", "path-planning", "computer-vision", "a-star"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=10.0"]
camera = ["opencv-python>=4.8"]
dev = ["matplotlib>=3.7", "pillow>=10.0", "opencv-python>=4.8", "pytest>=7.4"]

[project.scripts]
ppstack = "ppstack.__main__:main"

[tool.setuptools.packages.find]
include = ["ppstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]
